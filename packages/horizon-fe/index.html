<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <meta
            http-equiv="Cache-Control"
            content="no-cache, no-store, must-revalidate"
        />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <title>InvokeDB</title>
        <link rel="icon" href="/favicon.ico?q=2" />
        <!-- Stripe.js, used by the /checkout page -->
        <script src="https://js.stripe.com/v3/"></script>
        <style>
            html {
                height: 100%;
            }
            body {
                margin: 0;
                height: 100%;
                font-family:
                    'Open Sans', 'Avenir', Helvetica, Arial, sans-serif;
            }
            #root {
                width: 100%;
                height: 100%;
            }
            .app-loader {
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .app-loader .spinner {
                font-size: 100px;
                color: #484ec0;
                margin-bottom: 35px;
            }
            .app-loader .loading-text {
                font-size: 30px;
                color: #484ec0;
                font-weight: bold;
            }
        </style>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600&family=Source+Code+Pro:wght@500&display=swap"
        />
    </head>
    <body class="default">
        <noscript>
            <strong
                >We're sorry but Invoke doesn't work properly without JavaScript
                enabled. Please enable it to continue.</strong
            >
        </noscript>
        <div id="root">
            <div class="app-loader">
                <i class="fa fa-sync fa-spin spinner"></i>
                <span class="loading-text">Loading Database...</span>
            </div>
        </div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
