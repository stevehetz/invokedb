<div class="api-dialog">
    <div class="api-dialog-status" v-if="loading">Loading the API docs...</div>
    <div class="api-dialog-status error" v-else-if="load_error">
        {{ load_error }}
    </div>
    <template v-else-if="docs">
        <div class="api-dialog-intro">
            <p>
                The API for <b>{{ docs.table }}</b>, built from its columns.
                Snippets read your API key from the
                <code>{{ docs.api_key_env }}</code> environment variable:
            </p>
            <div class="url-block">
                <input class="url" :value="export_line_masked" readonly />
                <span
                    class="copy no-highlight"
                    title="Copy (with your key)"
                    @click="copy_to_clipboard('export', export_line)"
                    ><i class="fa fa-copy"></i
                ></span>
                <div class="copied-popup" v-if="copied === 'export'">
                    copied!
                </div>
            </div>
            <div class="api-dialog-links">
                <span
                    class="go-to-doc-link"
                    :title="'Also at GET ' + docs.openapi_url + ' with your key'"
                    @click="download_openapi"
                >
                    <i class="fa fa-download"></i> OpenAPI spec
                </span>
                <span class="go-to-doc-link" @click="go_to_doc_link(active)">
                    Full documentation <i class="fa fa-arrow-right"></i>
                </span>
            </div>
        </div>

        <div class="api-dialog-tabs no-highlight">
            <span
                v-for="e in docs.endpoints"
                :key="e.id"
                :class="['api-dialog-tab', e.id, { active: e.id === active }]"
                @click="select_endpoint(e.id)"
                >{{ e.title }}</span
            >
        </div>

        <div class="api-dialog-section" v-if="endpoint">
            <div class="url-block">
                <span :class="['method', 'no-highlight', method_class]"
                    >{{ endpoint.method }}</span
                >
                <input class="url" :value="endpoint.url" readonly />
                <span
                    class="copy no-highlight"
                    @click="copy_to_clipboard('url', endpoint.url)"
                    ><i class="fa fa-copy"></i
                ></span>
                <div class="copied-popup" v-if="copied === 'url'">copied!</div>
            </div>
            <p class="api-dialog-description">{{ endpoint.description }}</p>
            <table class="api-dialog-params">
                <tr v-for="p in endpoint.params" :key="p.name">
                    <td>
                        <code>{{ p.name }}</code>
                    </td>
                    <td class="param-in">{{ p.in }}</td>
                    <td>{{ p.description }}</td>
                </tr>
            </table>

            <div class="api-dialog-examples">
                <div v-if="endpoint.body !== undefined">
                    <h4>Example request body</h4>
                    <pre class="api-dialog-code">
{{ pretty(endpoint.body) }}</pre>
                </div>
                <div>
                    <h4>Example response ({{ endpoint.response.status }})</h4>
                    <pre class="api-dialog-code">
{{
                        endpoint.response.body === ''
                            ? '(no body)'
                            : pretty(endpoint.response.body)
                    }}</pre>
                </div>
            </div>

            <h4>Code</h4>
            <div class="api-dialog-langs no-highlight">
                <span
                    v-for="l in languages"
                    :key="l.id"
                    :class="['api-dialog-lang', { active: l.id === lang }]"
                    @click="lang = l.id"
                    >{{ l.label }}</span
                >
            </div>
            <div class="api-dialog-snippet">
                <pre class="api-dialog-code">{{ snippet }}</pre>
                <span
                    class="copy-snippet no-highlight"
                    @click="copy_to_clipboard('snippet', snippet)"
                    ><i class="fa fa-copy"></i> Copy</span
                >
                <div class="copied-popup" v-if="copied === 'snippet'">
                    copied!
                </div>
            </div>
            <p class="api-dialog-hint" v-if="lang === 'client'">
                <code>npm install invokedb</code>. Run it as an ES module (Node
                18+).
            </p>
            <p class="api-dialog-hint" v-else-if="lang === 'fetch'">
                Node 18+, as an ES module (<code>.mjs</code>).
            </p>
            <p class="api-dialog-hint" v-else-if="lang === 'python'">
                Python 3, standard library only.
            </p>

            <div class="api-dialog-try">
                <h4>Try it</h4>
                <div class="try-row">
                    <label>Key</label>
                    <input
                        class="try-key"
                        type="password"
                        v-model="try_key"
                        placeholder="Paste an API key"
                        autocomplete="off"
                    />
                    <label class="try-writes">
                        <input type="checkbox" v-model="allow_writes" />
                        Allow requests that change data
                    </label>
                </div>
                <p class="api-dialog-hint try-key-hint" v-if="!api_key">
                    Keys are only shown when they're made: make one on the
                    <span class="go-to-doc-link" @click="go_to_account"
                        >Account page</span
                    >
                    and paste it here.
                </p>
                <div class="try-row">
                    <label>URL</label>
                    <input class="try-url" v-model="try_url" />
                </div>
                <div class="try-row" v-if="endpoint.body !== undefined">
                    <label>Body</label>
                    <textarea
                        class="try-body"
                        v-model="try_body"
                        rows="6"
                        spellcheck="false"
                    ></textarea>
                </div>
                <p
                    class="api-dialog-hint"
                    v-if="!endpoint.read_only && !allow_writes"
                >
                    This request changes the table. Tick "Allow requests that
                    change data" to run it.
                </p>
                <p
                    class="api-dialog-hint"
                    v-else-if="try_body.includes(docs.row_id_placeholder)"
                >
                    Replace {{ docs.row_id_placeholder }} with a row's _id (Get
                    rows shows them).
                </p>
                <el-button
                    class="try-button"
                    type="primary"
                    size="small"
                    :loading="running"
                    :disabled="!can_try"
                    @click="try_it"
                    >Send request</el-button
                >
                <div class="try-response" v-if="try_response">
                    <h4>
                        Response:
                        <span
                            :class="[
                                'try-status',
                                try_response.ok ? 'ok' : 'fail'
                            ]"
                            >{{ try_response.status }}</span
                        >
                        <span class="try-time">{{ try_response.ms }} ms</span>
                    </h4>
                    <pre class="api-dialog-code">{{ try_response.body }}</pre>
                </div>
            </div>
        </div>
    </template>
</div>
