<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <meta
            http-equiv="Cache-Control"
            content="no-cache, no-store, must-revalidate"
        />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <title>InvokeDB</title>
        <link rel="icon" href="/favicon.ico?q=2" />
        <script>
            // The theme before first paint (#290), as core/theme.js sets it: the app (/app)
            // uses the account's choice kept in localStorage; the site and an embedded form
            // (light unless ?theme=dark) don't.
            (function () {
                var choice = 'system';
                var path = location.pathname;
                var query = new URLSearchParams(location.search);
                try {
                    if (path === '/app' || path.indexOf('/app/') === 0) {
                        choice =
                            localStorage.getItem('invokedb:theme') || 'system';
                    }
                } catch (e) {}
                if (path.indexOf('/f/') === 0 && query.get('embed')) {
                    choice = query.get('theme') === 'dark' ? 'dark' : 'light';
                }
                var dark =
                    choice === 'dark' ||
                    (choice !== 'light' &&
                        window.matchMedia &&
                        matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute(
                    'data-theme',
                    dark ? 'dark' : 'light'
                );
                if (dark) document.documentElement.classList.add('dark');
            })();
        </script>
        <style>
            html {
                height: 100%;
                color-scheme: light;
            }
            html[data-theme='dark'] {
                color-scheme: dark;
                background-color: #1c1c1c;
            }
            body {
                margin: 0;
                height: 100%;
                font-family:
                    'Open Sans', 'Avenir', Helvetica, Arial, sans-serif;
            }
            #root {
                width: 100%;
                height: 100%;
            }
            .app-loader {
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .app-loader .spinner {
                font-size: 100px;
                color: #484ec0;
                margin-bottom: 35px;
            }
            .app-loader .loading-text {
                font-size: 30px;
                color: #484ec0;
                font-weight: bold;
            }
            html[data-theme='dark'] .app-loader .spinner,
            html[data-theme='dark'] .app-loader .loading-text {
                color: #9da1f3;
            }
        </style>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600&family=Source+Code+Pro:wght@500&display=swap"
        />
    </head>
    <body class="default">
        <noscript>
            <strong
                >We're sorry but Invoke doesn't work properly without JavaScript
                enabled. Please enable it to continue.</strong
            >
        </noscript>
        <div id="root">
            <div class="app-loader">
                <i class="fa fa-sync fa-spin spinner"></i>
                <span class="loading-text">Loading Database...</span>
            </div>
        </div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
