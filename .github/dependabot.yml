# Weekly dependency updates: every npm lockfile (root tools, both packages, both examples) and
# the GitHub Actions in .github/workflows. Minor and patch updates come as one grouped PR per
# directory; majors get a PR each. They go through CI and the review like any other PR.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/horizon-be
      - /packages/horizon-fe
      - /examples/invokedb-node
      - /examples/angular
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
