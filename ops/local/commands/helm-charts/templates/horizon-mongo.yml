apiVersion: v1
kind: Service
metadata:
  name: horizon-mongo-svc
spec:
  type: NodePort
  ports:
  - port: 27017
    nodePort: {{ .Values.HORIZON_MONGO_PORT }}
  selector:
    svcCluster: horizon-mongo-svcCluster
---
apiVersion: v1
kind: Pod
metadata:
  name: horizon-mongo
  labels:
    svcCluster: horizon-mongo-svcCluster
spec:
  containers:
  - name: horizon-mongo
    image: mongo
    resources:
      requests:
        cpu: 200m
        memory: 250Mi
    ports:
    - containerPort: 27017
    volumeMounts:
    - name: db-files
      mountPath: /data/db
    - name: share
      mountPath: /data/share
  volumes:
  - name: db-files
    hostPath:
      path: /data/dev/mongo/db-files
      type: DirectoryOrCreate
  - name: share
    hostPath:
      path: /data/share
      type: DirectoryOrCreate