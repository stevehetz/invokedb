# A caller of stevehetzl/agent-pipeline's automerge.yml (#4 there); its behaviour is documented in that
# file. InvokeDB's settings are the `with:` inputs below.
name: Auto-merge

on:
  workflow_run:
    workflows: [CI, Review]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: The PR's head branch to try merging
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: automerge-${{ github.event.workflow_run.head_branch || inputs.branch || 'sweep' }}
  cancel-in-progress: false

jobs:
  automerge:
    uses: stevehetzl/agent-pipeline/.github/workflows/automerge.yml@v1
    with:
      branch: ${{ inputs.branch }}
      held_paths: |
        .github/
        deploy/
        packages/horizon-be/src/database/migration/
        *.env.example
      ci_workflow_file: ci.yml
