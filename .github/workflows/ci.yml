# Checks every pull request and every push to main: backend build + lint + unit tests, the API
# smoke test against a real backend (Postgres and Mongo as service containers), frontend build +
# lint (and no Sass deprecation warnings), and prettier. Needs no secrets.
#
# pull_request (opened, each push to the PR's branch, reopened): one run per push, a person's PR
# or the cloud agent's, and it's the run the merge rule on main counts. It tests the PR's head
# merged with the current base. The agent's own push uses the workflow token, which starts no
# workflows, and GitHub doesn't count workflow_dispatch runs toward a PR's required checks (#40);
# the agent, revise and repair open or push with the Claude app's token, which does start this
# run. A branch without a PR gets no CI until one is opened (#42).
# push to main: a merge made in the browser, so CI runs again before CD (cd.yml deploys only
# after a push run on main).
# workflow_dispatch: automerge.yml's merges push nothing that starts workflows, so it starts CI
# on main itself (its `deploy` job then starts cd.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/horizon-be
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/horizon-be/package-lock.json
      # --omit=optional skips the native Postgres log transport, as on the Mac
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # scripts/api-smoke.mjs against the built backend, on throwaway databases (smoke-env.sh, as in
  # the verify-backend playbook): logs in as the seeded demo accounts, uploads a CSV, exercises
  # the grid and /api/v1 endpoints, and checks accounts can't reach each other's data.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # like Postgres.app locally; .env.example has no password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      HORIZON_ENV_FILE: ${{ github.workspace }}/smoke.env
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/horizon-be/package-lock.json
      - run: npm ci --omit=optional --no-audit --no-fund
        working-directory: packages/horizon-be
      - run: npm run build
        working-directory: packages/horizon-be
      # No .env in CI, so smoke-env.sh starts from .env.example
      - run: bash scripts/smoke-env.sh "$HORIZON_ENV_FILE"
      - name: Create the databases and run the migrations (they seed the demo accounts)
        run: bash scripts/db-setup.sh
      - name: Start the backend (built, as in production)
        run: |
          bash -c 'source scripts/env.sh && cd packages/horizon-be && exec node dist/main.js' \
            > backend.log 2>&1 &
          for i in $(seq 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8101/auth/authorize && exit 0
            sleep 1
          done
          echo '::error::The backend did not answer on :8101 within 60 seconds'
          exit 1
      - run: node scripts/api-smoke.mjs http://127.0.0.1:8101 smoke.json
      - name: Backend log
        if: failure()
        run: cat backend.log || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/horizon-fe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/horizon-fe/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build (fails on Sass deprecation warnings)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -qi 'deprecation warning' build.log; then
              echo '::error::The frontend build printed Sass deprecation warnings (see above)'
              exit 1
          fi
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: the root postinstall would install both packages too
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --check .

  # automerge.yml starts CI on main after it merges (workflow_dispatch). GitHub doesn't tell
  # cd.yml when such a run finishes, so this starts the deploy once every check above passed.
  deploy:
    needs: [backend, smoke, frontend, format]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh workflow run cd.yml -R "$GITHUB_REPOSITORY" --ref main -f sha="$GITHUB_SHA"
