<div class="dashboard-page">
    <div class="dashboard-inner">
        <div class="dashboard-status" v-if="loading">
            Loading the dashboard...
        </div>

        <div class="dashboard-unavailable" v-else-if="unavailable">
            <h1>{{ unavailable }}</h1>
        </div>

        <template v-else>
            <header class="dashboard-head">
                <h1 class="dashboard-title">{{ dashboard.name }}</h1>
                <span class="dashboard-updated">
                    Live data, updated {{ updated_text }}
                </span>
            </header>
            <dashboard-tiles :tiles="dashboard.tiles"></dashboard-tiles>
            <footer class="dashboard-foot">
                Made with <a href="/">InvokeDB</a>
            </footer>
        </template>
    </div>
</div>
