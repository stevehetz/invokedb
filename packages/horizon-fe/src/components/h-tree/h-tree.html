<div class="h-tree">
    <div class="left">
        <div class="h-tree-controls">
            <el-menu
                ref="menu"
                class="file-directory-menu"
                mode="horizontal"
                :ellipsis="false"
                menu-trigger="click"
                @select="add_tree_item"
            >
                <el-sub-menu
                    index="1"
                    popper-class="h-tree-menu-popper menu-dropdown-popper"
                >
                    <template #title>
                        <i class="title-icon fa fa-plus"></i>
                    </template>
                    <el-menu-item index="dir" class="divide-bottom"
                        ><i class="fa fa-folder"></i> Folder</el-menu-item
                    >
                    <el-menu-item index="data-grid"
                        ><i class="fa fa-table"></i> Empty Table</el-menu-item
                    >
                    <el-menu-item index="template"
                        ><i class="fa fa-th-list"></i> Table from
                        Template</el-menu-item
                    >
                    <el-menu-item index="upload"
                        ><i class="fa fa-upload"></i> Table from
                        CSV</el-menu-item
                    >
                    <el-menu-item index="url"
                        ><i class="fa fa-link"></i> Table from URL or Google
                        Sheet</el-menu-item
                    >
                    <el-menu-item index="ai" v-if="ai_enabled"
                        ><i class="fa fa-wand-magic-sparkles"></i> Table from a
                        Description (AI)</el-menu-item
                    >
                </el-sub-menu>
            </el-menu>
            <div
                class="schema-diagram-button"
                title="Schema diagram"
                @click="$emit('open_schema')"
            >
                <i class="fa fa-diagram-project"></i>
            </div>
            <div
                class="manage-items"
                v-bind:class="{ active: managed.length > 0}"
            >
                <div
                    class="manage-item remove-items"
                    @click="remove_tree_items"
                >
                    <i class="remove-item-icon fa fa-trash"></i>
                </div>
                <div class="manage-item edit-items" @click="edit_tree_items">
                    <i class="remove-item-icon fa fa-edit"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="right">
        <div class="empty-db-message" v-if="tree_items.length === 0">
            <p>Click the <i class="fa fa-plus"></i> to add</p>
            <p>a table</p>
            <p>
                or
                <el-button
                    class="start-from-template"
                    link
                    type="primary"
                    @click="add_tree_item('template')"
                    >start from a template</el-button
                >
            </p>
        </div>
        <div class="tree-wrapper">
            <el-tree
                ref="tree"
                class="h-tree-nodes"
                :data="tree_items"
                node-key="id"
                :props="tree_props"
                :indent="18"
                :default-expanded-keys="expanded_keys"
                :allow-drop="allow_drop"
                draggable
                @node-click="node_clicked"
                @node-drop="node_dropped"
                @node-expand="node_expanded"
                @node-collapse="node_collapsed"
                @node-contextmenu="node_contextmenu"
            >
                <template #default="{ node, data }">
                    <span
                        class="tree-node"
                        :class="node_classes(data)"
                        @dblclick="node_dblclicked(data)"
                    >
                        <span
                            v-if="node_icon(node, data)"
                            class="icon-wrapper"
                            v-html="node_icon(node, data)"
                        ></span>
                        <span class="tree-node-title"
                            ><template v-if="data.dup_opened_seq"
                                >({{ data.dup_opened_seq }}) </template
                            >{{ data.name }}</span
                        >
                    </span>
                </template>
            </el-tree>
        </div>
    </div>
    <div class="tree-background"></div>
    <teleport to="body">
        <div
            v-if="context_menu"
            class="h-tree-context-menu"
            :style="{ left: context_menu.x + 'px', top: context_menu.y + 'px' }"
            role="menu"
            @contextmenu.prevent
        >
            <template v-if="context_menu.item.type === 'dir'">
                <div
                    class="context-item"
                    role="menuitem"
                    @click="context_action('add', 'data-grid')"
                >
                    <i class="fa fa-table"></i> New table here
                </div>
                <div
                    class="context-item"
                    role="menuitem"
                    @click="context_action('add', 'template')"
                >
                    <i class="fa fa-th-list"></i> New table from template here
                </div>
                <div
                    class="context-item"
                    role="menuitem"
                    @click="context_action('add', 'upload')"
                >
                    <i class="fa fa-upload"></i> New table from CSV here
                </div>
                <div
                    class="context-item"
                    role="menuitem"
                    @click="context_action('add', 'url')"
                >
                    <i class="fa fa-link"></i> New table from URL here
                </div>
                <div
                    v-if="ai_enabled"
                    class="context-item"
                    role="menuitem"
                    @click="context_action('add', 'ai')"
                >
                    <i class="fa fa-wand-magic-sparkles"></i> New table from a
                    description here
                </div>
            </template>
            <template v-else>
                <div
                    class="context-item"
                    role="menuitem"
                    @click="context_action('open')"
                >
                    <i class="fa fa-table"></i> Open
                </div>
                <div
                    class="context-item"
                    role="menuitem"
                    @click="context_action('move')"
                >
                    <i class="fa fa-folder"></i> Move to folder…
                </div>
            </template>
            <div
                class="context-item divide-top"
                role="menuitem"
                @click="context_action('rename')"
            >
                <i class="fa fa-edit"></i> Rename
            </div>
            <div
                class="context-item danger"
                role="menuitem"
                @click="context_action('delete')"
            >
                <i class="fa fa-trash"></i> Delete
            </div>
        </div>
    </teleport>
</div>
