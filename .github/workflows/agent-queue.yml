# A caller of stevehetzl/agent-pipeline's agent-queue.yml (#4 there); its behaviour is documented in that
# file. InvokeDB's settings are the `with:` inputs below.
name: Agent queue

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed, labeled]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # a safety net; the queue really moves on events

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: agent-queue
  cancel-in-progress: false

jobs:
  queue:
    uses: stevehetzl/agent-pipeline/.github/workflows/agent-queue.yml@v1
    with:
      project_number: 1
    secrets:
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
