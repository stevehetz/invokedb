<div class="page-form subscription-form">
    <div class="form-heading">
        <div class="flex-2-col">
            <div class="left">
                <h3>Plan</h3>
            </div>
            <div class="right"></div>
        </div>
    </div>
    <div class="form-body loading" v-if="loading">Loading plan...</div>
    <div class="form-body" v-if="!loading">
        <div class="subscription-tier">
            <label>Plan:</label>
            <span class="plan-name">{{ plan_name }}</span>
            <span
                class="plan-status"
                v-if="status && status.plan_status === 'past_due'"
                >Payment failed: update your card in billing</span
            >
        </div>
        <table class="usage-table" v-if="usage_rows.length">
            <tr v-for="row in usage_rows" :key="row.label">
                <td class="usage-label">{{ row.label }}</td>
                <td class="usage-value" :class="{ over: row.used >= row.max }">
                    {{ format(row.used) }} / {{ format(row.max) }}
                </td>
            </tr>
        </table>
        <div class="notice" v-if="notice">{{ notice }}</div>
        <div class="locked-message" v-if="status && status.read_only">
            <span>Read-only</span>
            <span v-if="status.read_only_reason"
                >: {{ status.read_only_reason }}. Delete tables or
                upgrade.</span
            >
        </div>
        <div class="locked-message" v-if="error">{{ error }}</div>
        <div class="links">
            <el-button
                type="primary"
                v-if="can_upgrade"
                :loading="redirecting"
                @click="go('checkout')"
                >Upgrade</el-button
            >
            <el-button
                v-if="can_manage"
                :loading="redirecting"
                @click="go('portal')"
                >Manage billing</el-button
            >
            <a href="/pricing" class="pricing-link">See plans</a>
        </div>
    </div>
</div>
