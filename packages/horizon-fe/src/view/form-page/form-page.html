<div :class="['form-page', { embed }]">
    <div class="form-card">
        <div class="form-status" v-if="loading">Loading the form...</div>

        <div class="form-unavailable" v-else-if="unavailable">
            <h1>{{ unavailable }}</h1>
        </div>

        <div class="form-done" v-else-if="done">
            <i class="fa fa-check-circle"></i>
            <p>{{ thank_you }}</p>
            <button type="button" class="form-again" @click="again">
                Send another response
            </button>
        </div>

        <form v-else class="form-body" novalidate @submit.prevent="submit">
            <h1 class="form-title">{{ form.title }}</h1>
            <p class="form-description" v-if="form.description">
                {{ form.description }}
            </p>

            <div
                v-for="f in form.fields"
                :key="f.key"
                :class="['form-field', { invalid: !!errors[f.key] }]"
            >
                <label :for="'form-field-' + f.key">
                    {{ f.label }}
                    <span class="form-required" v-if="f.required">*</span>
                </label>
                <textarea
                    v-if="f.type === 'string' && is_long(f)"
                    :id="'form-field-' + f.key"
                    v-model="values[f.key]"
                    :required="f.required"
                    rows="4"
                ></textarea>
                <input
                    v-else
                    :id="'form-field-' + f.key"
                    :type="input_type(f)"
                    :step="f.type === 'number' ? 'any' : undefined"
                    v-model="values[f.key]"
                    :required="f.required"
                />
                <div class="form-help" v-if="f.help">{{ f.help }}</div>
                <div class="form-error" v-if="errors[f.key]">
                    {{ errors[f.key] }}
                </div>
            </div>

            <!-- People don't see this field, so they leave it empty; bots fill it -->
            <div class="form-hp" aria-hidden="true">
                <label :for="'form-hp-' + form.id">Leave this empty</label>
                <input
                    :id="'form-hp-' + form.id"
                    :name="form.honeypot"
                    v-model="honeypot"
                    tabindex="-1"
                    autocomplete="off"
                />
            </div>

            <div class="form-message error" v-if="message">{{ message }}</div>

            <button type="submit" class="form-submit" :disabled="sending">
                {{ sending ? 'Sending...' : form.submit_label }}
            </button>
        </form>

        <div class="form-footer">
            Made with <a href="/" target="_blank" rel="noopener">InvokeDB</a>
        </div>
    </div>
</div>
