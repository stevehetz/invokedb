apiVersion: v1
kind: Service
metadata:
  name: horizon-postgres-svc
spec:
  type: NodePort
  ports:
  - port: 5432
    nodePort: {{ .Values.HORIZON_POSTGRES_PORT }}
  selector:
    svcCluster: horizon-postgres-svcCluster
---
apiVersion: v1
kind: Pod
metadata:
  name: horizon-postgres
  labels:
    svcCluster: horizon-postgres-svcCluster
spec:
  containers:
  - name: horizon-postgres
    image: postgres
    resources:
      requests:
        cpu: 200m
        memory: 250Mi
    ports:
    - containerPort: 5432
    env:
    - name: POSTGRES_DB
      value: {{ .Values.HORIZON_POSTGRES_DB }}
    - name: POSTGRES_USER
      value: {{ .Values.HORIZON_POSTGRES_USERNAME }}
    - name: POSTGRES_PASSWORD
      value: {{ .Values.HORIZON_POSTGRES_PASSWORD }}
    - name: PGDATA
      value: /var/lib/postgresql/data/db-files
    volumeMounts:
    - name: db-files
      mountPath: /var/lib/postgresql/data/db-files
    - name: share
      mountPath: /data/share
  volumes:
  - name: db-files
    hostPath:
      path: /data/dev/postgres/db-files
      type: DirectoryOrCreate
  - name: share
    hostPath:
      path: /data/share
      type: DirectoryOrCreate

