<div class="page verify-email-page">
    <div class="main-heading">
        <div class="flex-row">
            <div class="col col-25">
                <router-link class="title-link" to="/">
                    <img
                        class="heading-logo-title"
                        src="@/assets/logo-title.svg"
                    />
                    <img class="heading-logo-icon" src="@/assets/logo.svg" />
                </router-link>
            </div>
        </div>
    </div>
    <div class="main-body">
        <div class="main-body-wrapper">
            <div class="panel-box">
                <div class="top">
                    <h4 class="panel-title">Confirm your email address</h4>
                    <div
                        v-if="state === 'checking'"
                        class="verify-email-message"
                    >
                        <p>Checking your link…</p>
                    </div>
                    <div
                        v-if="state === 'done'"
                        class="verify-email-message done"
                    >
                        <p>
                            Thanks, your email address is confirmed. You can now
                            create tables and use your API key.
                        </p>
                    </div>
                </div>
                <div class="bottom">
                    <div class="error-box">
                        <div class="error-message" v-if="state === 'failed'">
                            <i class="fa fa-exclamation-triangle"></i>
                            <span>{{ message }}</span>
                        </div>
                    </div>
                    <div class="control-box" v-if="state !== 'checking'">
                        <router-link :to="app_path"
                            >Go to the app <i class="fa fa-arrow-right"></i
                        ></router-link>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
