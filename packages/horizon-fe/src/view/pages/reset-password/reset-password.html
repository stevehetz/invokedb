<div class="page reset-password-page">
    <div class="main-heading">
        <div class="flex-row">
            <div class="col col-25">
                <router-link class="title-link" to="/">
                    <img
                        class="heading-logo-title"
                        v-bind:src="require('@/assets/logo-title.svg')"
                    />
                    <img
                        class="heading-logo-icon"
                        v-bind:src="require('@/assets/logo.svg')"
                    />
                </router-link>
            </div>
            <div class="col col-75 pull-right">
                <router-link to="/contact">Contact</router-link>
                <router-link to="/pricing">Pricing</router-link>
                <router-link to="/create-account">Sign Up</router-link>
                <router-link to="/login" class="sign-in">
                    <span>Sign In</span>
                    <i class="fa fa-arrow-right"></i>
                </router-link>
            </div>
        </div>
    </div>
    <div class="panel-box">
        <div class="top">
            <h4 class="panel-title">Create a new password</h4>
            <form>
                <div class="info-box">
                    <label>E-mail:</label>
                    <span>{{ email }}</span>
                </div>
                <div class="input-box">
                    <el-input
                        type="password"
                        ref="password"
                        v-model="password"
                        placeholder="Password"
                        @keyup.enter.native="send"
                    ></el-input>
                </div>
                <div class="input-box">
                    <el-input
                        type="password"
                        v-model="retype_password"
                        placeholder="Retype Password"
                        @keyup.enter.native="send"
                    ></el-input>
                </div>
            </form>
        </div>
        <div class="bottom">
            <div class="error-box">
                <div class="error-message" v-if="error.message !== ''">
                    <i class="fa fa-exclamation-triangle"></i>
                    <span>{{ error.message }}</span>
                </div>
            </div>
            <div class="control-box">
                <div class="flex-2-col">
                    <div class="left"></div>
                    <div class="right">
                        <a href="" class="submit-button" @click="send($event)"
                            >Submit <i class="fa fa-arrow-right"></i
                        ></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
