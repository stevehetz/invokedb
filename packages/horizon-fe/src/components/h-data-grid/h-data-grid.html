<div class="h-data-grid" :class="{ 'edit-column-mode': edit_column_mode }">
    <div class="top" ref="top">
        <div class="flex-3-col">
            <div class="left" ref="top_left">
                <div class="controls">
                    <!--<div class="control-box">
                        <label class="controls-label">
                            File:
                        </label>
                        <el-button link class="purple" @click="upload_clicked">
                            <i class="fa fa-upload"></i>
                            <span>Upload</span>
                        </el-button>
                    </div>-->
                    <div class="control-box">
                        <div class="commit-controls">
                            <el-button
                                link
                                class="white"
                                @click="cancel_clicked"
                                :disabled="saving_columns || (!add_row_mode && !edit_column_mode && !show_delete_rows || table_lock)"
                            >
                                <i class="fa fa-times"></i>
                            </el-button>
                            <el-button
                                link
                                class="red"
                                @click="delete_rows_clicked"
                                :disabled="saving_columns || (!show_delete_rows || edit_column_mode || table_lock)"
                            >
                                <i class="fa fa-trash"></i>
                            </el-button>
                            <el-button
                                link
                                class="blue"
                                @click="save_clicked"
                                :disabled="saving_columns ||
                                    (!add_row_mode 
                                    && !edit_column_mode
                                    || (edit_column_mode && edit_column_count === 0 && delete_columns.length === 0)
                                    || table_lock)"
                            >
                                <i class="fa fa-save"></i>
                            </el-button>
                        </div>
                        <div class="edit-controls">
                            <el-button
                                link
                                class="purple add-column-button"
                                @click="add_column_clicked"
                                :disabled="saving_columns || disable_add_column || table_lock"
                                v-if="edit_column_mode && !add_row_mode"
                            >
                                <i class="fa fa-plus-square"></i>
                                <span>Add Column</span>
                            </el-button>
                            <el-button
                                link
                                class="green edit-column-button"
                                @click="edit_columns_clicked"
                                v-if="!edit_column_mode"
                                :disabled="saving_columns || add_row_mode || table_lock || other_view"
                            >
                                <i class="fa fa-pencil-alt"></i>
                                <span>Edit Columns</span>
                            </el-button>
                            <el-button
                                link
                                class="orange"
                                @click="add_row_clicked"
                                :disabled="saving_columns || edit_column_mode || table_lock || other_view"
                            >
                                <i class="fa fa-plus-square"></i>
                                <span>Add Row</span>
                            </el-button>
                            <el-button
                                link
                                class="blue"
                                @click="refresh_clicked"
                                :disabled="saving_columns || edit_column_mode || add_row_mode || table_lock"
                            >
                                <i class="fa fa-sync-alt"></i>
                                <span>Refresh</span>
                            </el-button>
                            <el-button
                                link
                                class="purple url-source-button"
                                @click="url_source_clicked"
                                v-if="url_source"
                                :disabled="saving_columns || edit_column_mode || add_row_mode || processing"
                            >
                                <i class="fa fa-cloud-download-alt"></i>
                                <span>Sync</span>
                            </el-button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="middle">
                <div class="top-bar-output" v-if="top_bar_show">
                    <span v-html="top_bar_message"></span>
                </div>
            </div>
            <div class="right">
                <div class="info" ref="top_info">
                    <p>
                        Total rows: {{ total_rows_with_row_filter !== null ?
                        total_rows_with_row_filter.toLocaleString() :
                        total_rows.toLocaleString() }}
                    </p>
                    <div class="views-button">
                        <el-dropdown
                            trigger="click"
                            :disabled="table_lock || edit_column_mode || add_row_mode"
                            @command="view_command"
                        >
                            <el-button
                                link
                                class="views-menu-button"
                                :title="tucked('views_label') ? (current_view ? current_view.name : 'Views') : null"
                                :disabled="table_lock || edit_column_mode || add_row_mode"
                            >
                                <i
                                    :class="current_view ? view_icons[current_view.type] : 'fa fa-eye'"
                                ></i>
                                <span
                                    class="views-current"
                                    v-if="!tucked('views_label')"
                                    >{{ current_view ? current_view.name :
                                    'Views' }}</span
                                >
                                <i class="fa fa-caret-down"></i>
                            </el-button>
                            <template #dropdown>
                                <el-dropdown-menu class="views-menu">
                                    <el-dropdown-item
                                        command="grid"
                                        :class="{ current: !current_view }"
                                    >
                                        <i class="fa fa-table"></i> All rows
                                    </el-dropdown-item>
                                    <el-dropdown-item
                                        v-for="v in views"
                                        :key="v.id"
                                        :command="v.id"
                                        :class="['views-menu-item', { current: current_view && current_view.id === v.id }]"
                                    >
                                        <i :class="view_icons[v.type]"></i>
                                        {{ v.name }}
                                    </el-dropdown-item>
                                    <el-dropdown-item
                                        divided
                                        command="manage"
                                        class="views-manage"
                                    >
                                        <i class="fa fa-cog"></i> Save or manage
                                        views...
                                    </el-dropdown-item>
                                </el-dropdown-menu>
                            </template>
                        </el-dropdown>
                    </div>
                    <div class="api-button" v-if="!tucked('api')">
                        <el-button
                            link
                            @click="api_btn_clicked"
                            :disabled="table_lock"
                        >
                            <i class="fa fa-clone"></i>
                            <span>API</span>
                        </el-button>
                    </div>
                    <div class="webhooks-button" v-if="!tucked('webhooks')">
                        <el-button
                            link
                            @click="webhooks_btn_clicked"
                            :disabled="table_lock"
                        >
                            <i class="fa fa-bolt"></i>
                            <span>Webhooks</span>
                        </el-button>
                    </div>
                    <div
                        class="ask-data-button"
                        v-if="ai_available && !tucked('ask')"
                    >
                        <el-button link @click="ask_btn_clicked">
                            <i class="fa fa-wand-magic-sparkles"></i>
                            <span>Ask AI</span>
                        </el-button>
                    </div>
                    <div class="more-button">
                        <el-dropdown
                            trigger="click"
                            :disabled="table_lock && !tucked('ask')"
                            @command="more_command"
                        >
                            <el-button
                                link
                                class="more-menu-button"
                                title="More"
                                aria-label="More"
                                :disabled="table_lock && !tucked('ask')"
                            >
                                <i class="fa fa-ellipsis-h"></i>
                            </el-button>
                            <template #dropdown>
                                <el-dropdown-menu class="more-menu">
                                    <!-- Top-bar buttons that don't fit (fit_toolbar) -->
                                    <el-dropdown-item
                                        v-if="tucked('api')"
                                        command="api"
                                        class="more-api"
                                        :disabled="table_lock"
                                    >
                                        <i class="fa fa-clone"></i> API
                                    </el-dropdown-item>
                                    <el-dropdown-item
                                        v-if="tucked('webhooks')"
                                        command="webhooks"
                                        class="more-webhooks"
                                        :disabled="table_lock"
                                    >
                                        <i class="fa fa-bolt"></i> Webhooks
                                    </el-dropdown-item>
                                    <el-dropdown-item
                                        v-if="ai_available && tucked('ask')"
                                        command="ask"
                                        class="more-ask"
                                    >
                                        <i
                                            class="fa fa-wand-magic-sparkles"
                                        ></i>
                                        Ask AI
                                    </el-dropdown-item>
                                    <el-dropdown-item
                                        command="history"
                                        class="more-history"
                                        :divided="toolbar_tucked > 0"
                                        :disabled="table_lock"
                                    >
                                        <i class="fa fa-history"></i> History
                                    </el-dropdown-item>
                                    <el-dropdown-item
                                        v-if="ai_available"
                                        command="ai_columns"
                                        class="more-ai-columns"
                                        :disabled="table_lock"
                                    >
                                        <i
                                            class="fa fa-wand-magic-sparkles"
                                        ></i>
                                        AI columns
                                    </el-dropdown-item>
                                </el-dropdown-menu>
                            </template>
                        </el-dropdown>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <grid-toast ref="grid_toast"></grid-toast>
        <div class="column-overlay" v-if="saving_columns"></div>
        <div class="grid-overlay" v-if="saving_columns || processing"></div>
        <div class="grid-processing-overlay" v-if="processing">
            <i class="fa fa-sync fa-spin"></i>
            <span>Table is updating...</span>
        </div>
        <div class="view-pane" v-if="other_view">
            <kanban-view
                v-if="current_view.type === 'kanban'"
                :key="current_view.id + ':' + view_version"
                :view="current_view"
                :file_directory_id="file_directory_id"
                :locked="table_lock || processing"
                @saved="view_row_saved"
            ></kanban-view>
            <chart-view
                v-if="current_view.type === 'chart'"
                :key="current_view.id + ':' + view_version"
                :view="current_view"
            ></chart-view>
            <calendar-view
                v-if="current_view.type === 'calendar'"
                :key="current_view.id + ':' + view_version"
                :view="current_view"
            ></calendar-view>
            <map-view
                v-if="current_view.type === 'map'"
                :key="current_view.id + ':' + view_version"
                :view="current_view"
            ></map-view>
        </div>
        <ag-grid-vue
            :class="['ag-grid-wrapper', { 'behind-view': other_view }]"
            :gridOptions="grid_options"
        >
        </ag-grid-vue>
    </div>
</div>
