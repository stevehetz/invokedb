<div class="page account-page">
    <div class="page-body">
        <nav class="account-nav" aria-label="Account sections">
            <router-link
                v-for="s in sections"
                :key="s.id"
                :to="{ query: { section: s.id } }"
                :class="['account-nav-item', 'account-nav-' + s.id, { active: section === s.id }]"
                :aria-current="section === s.id ? 'page' : undefined"
            >
                <i :class="['fa', s.icon]"></i>
                <span>{{ s.label }}</span>
            </router-link>
        </nav>
        <div :class="['account-section', 'account-section-' + section]">
            <template v-if="section === 'usage'">
                <subscription-form :account="account"></subscription-form>
            </template>
            <template v-else-if="section === 'api-keys'">
                <api-key-form></api-key-form>
            </template>
            <template v-else-if="section === 'profile'">
                <account-info-form :account="account"></account-info-form>
            </template>
            <template v-else-if="section === 'security'">
                <change-password-form></change-password-form>
                <two-factor-form></two-factor-form>
            </template>
            <template v-else-if="section === 'history'">
                <div class="page-form audit-log-form">
                    <div class="form-heading">
                        <h3>History</h3>
                    </div>
                    <div class="form-body">
                        <audit-log :props="{}"></audit-log>
                    </div>
                </div>
            </template>
            <template v-else-if="section === 'data'">
                <data-export-form></data-export-form>
                <delete-account-form :account="account"></delete-account-form>
            </template>
        </div>
    </div>
</div>
