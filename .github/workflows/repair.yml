# A caller of stevehetzl/agent-pipeline's repair.yml (#4 there); its behaviour is documented in that
# file. InvokeDB's settings are the `with:` inputs below.
name: Repair

on:
  workflow_run:
    workflows: [CI, CD]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: The failed run to repair
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: repair-${{ github.event.workflow_run.head_branch || 'dispatch' }}
  cancel-in-progress: false

jobs:
  repair:
    uses: stevehetzl/agent-pipeline/.github/workflows/repair.yml@v1
    with:
      run_id: ${{ inputs.run_id }}
      node_version_file: .nvmrc
      checks: |
        Install what you need: `npm ci --omit=optional --no-audit --no-fund` in packages/horizon-be, `npm ci --no-audit --no-fund` in packages/horizon-fe, `npm ci --ignore-scripts --no-audit --no-fund` at the root.
        Backend: `npm run build`, `npm run lint`, `npm test`. Frontend: `npm run build`, `npm run lint`, `npm run typecheck`.
        There are no databases here; CI's `smoke` job runs the API smoke test on the PR.
        From the root, `npx prettier --write` the files you changed.
      never: |
        Never touch deploy/prod.env, never run deploy/deploy.sh or the smoke scripts (scripts/api-smoke.mjs, scripts/ui-smoke.mjs), and never edit a database migration that has already shipped.
      notes: |
        If the failed workflow is "E2E": it runs scripts/ui-smoke.mjs against production
        (https://invokedb.com) as a test account (e2e.yml). The cause is either the app (a real
        bug that's live) or the test (a step that doesn't match the app). Decide which from the
        code; the failing step's screenshot is in the run's `e2e` artifact
        (`gh run download <run id> -n e2e -D .git/e2e`). Fix the app if it's broken, otherwise
        the test. You can't run it against production; check with the frontend build, lint and
        typecheck (and the backend's, if you change it).
        If the failed workflow is "CD": it deploys over SSH to the server (cd.yml,
        deploy/ci-deploy.sh). A failure there is usually outside the code (the server, the
        firewall, DNS): open an issue with the diagnosis rather than change code.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
