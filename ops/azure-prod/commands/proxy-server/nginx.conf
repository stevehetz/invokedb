events {
  worker_connections  4096;
}

http {
  include mime.types;
  client_max_body_size 1000M;

  map ${DOLLAR}http_upgrade ${DOLLAR}connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen              3000;
    server_name         sb2.invokedb.com;

    location / {
      proxy_pass http://${HORIZON_SB_PRIV_WS_HOST}:${HORIZON_SB_PRIV_WS_PORT};
      proxy_http_version 1.1;
      proxy_set_header Upgrade ${DOLLAR}http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host ${DOLLAR}host;
    }
  }

  server {
    listen              3000;
    server_name         api.invokedb.com;
    

    location / {
      proxy_buffering off;
      proxy_pass  http://${HORIZON_BE_PRIV_HTTP_HOST}:${HORIZON_BE_PRIV_HTTP_PORT}/api/;
    }
  }

  server {
    listen              3000;
    server_name         be.invokedb.com;
    

    location / {
      proxy_buffering off;
      proxy_pass  http://${HORIZON_BE_PRIV_HTTP_HOST}:${HORIZON_BE_PRIV_HTTP_PORT};
    }
  }

  server {
    listen              3000;
    server_name         prc.invokedb.com;
    proxy_send_timeout  2000s;
    proxy_read_timeout  2000s;

    
    location / {
      proxy_buffering off;
      proxy_pass  http://${HORIZON_PRC_PRIV_HTTP_HOST}:${HORIZON_PRC_PRIV_HTTP_PORT};
    }
  }

  server {
    listen              3000 ;
    server_name         db.invokedb.com;

    location / {
      root   /usr/share/nginx/html/horizon-fe;
      try_files ${DOLLAR}uri /index.html;
      location ~* \.(html)$ {
        add_header Last-Modified ${DOLLAR}date_gmt;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
      }
    }
  }

  server {
    listen              3000;
    server_name         invokedb.com;

    location / {
      root   /usr/share/nginx/html/horizon-auth-fe;
      try_files ${DOLLAR}uri /index.html;
      location ~* \.(html)$ {
        add_header Last-Modified ${DOLLAR}date_gmt;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
      }
    }
  }

  server {
    listen              3000;
    server_name         www.invokedb.com;

    location / {
      root   /usr/share/nginx/html/horizon-auth-fe;
      try_files ${DOLLAR}uri /index.html;
      location ~* \.(html)$ {
        add_header Last-Modified ${DOLLAR}date_gmt;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
      }
    }
  }

  server {
    listen              3000;
    server_name         demo.invokedb.com;

    location / {
      root   /usr/share/nginx/html/horizon-demo;
      try_files ${DOLLAR}uri /index.html;
      location ~* \.(html)$ {
        add_header Last-Modified ${DOLLAR}date_gmt;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
      }
    }
  }
}