# A caller of stevehetzl/agent-pipeline's resolve.yml (#4 there); its behaviour is documented in that
# file. InvokeDB's settings are the `with:` inputs below.
name: Resolve conflicts

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '20,50 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (empty checks every open PR)
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: resolve
  cancel-in-progress: false

jobs:
  resolve:
    uses: stevehetzl/agent-pipeline/.github/workflows/resolve.yml@v1
    with:
      pr: ${{ inputs.pr }}
      node_version_file: .nvmrc
      checks: |
        Install what you need: `npm ci --omit=optional --no-audit --no-fund` in packages/horizon-be, `npm ci --no-audit --no-fund` in packages/horizon-fe, `npm ci --ignore-scripts --no-audit --no-fund` at the root.
        Backend: `npm run build`, `npm run lint`, `npm test`. Frontend: `npm run build`, `npm run lint`, `npm run typecheck`.
        There are no databases here; CI's `smoke` job runs the API smoke test on the PR.
        From the root, `npx prettier --write` the files you changed.
      never: |
        Never touch deploy/prod.env, never run deploy/deploy.sh or the smoke scripts (scripts/api-smoke.mjs, scripts/ui-smoke.mjs), and never edit a database migration that has already shipped.
      lockfiles: |
        For a `package-lock.json`: resolve `package.json` first, then take main's lockfile
        (`git checkout --theirs <lockfile>`) and regenerate it with
        `npm install --package-lock-only --no-audit --no-fund` in that folder (add
        `--omit=optional` in packages/horizon-be).
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
