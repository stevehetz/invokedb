<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>InvokeDB delivery: from pull request to production</title>
  <desc>How a change reaches production through GitHub (CI, the Claude review, auto-merge, CD, the end-to-end test), the workflows around it, and where the secrets live, by name only. See docs/OPERATIONS.md.</desc>
  <style>
    .bg { fill: #ffffff; }
    .grp { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .h { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .g { fill: #1f2328; font-size: 15px; font-weight: 700; }
    .d { fill: #59636e; font-size: 11.5px; }
    .title { fill: #1f2328; font-size: 20px; font-weight: 700; }
    .flow { stroke: #0969da; }
    .ssh { stroke: #9a6700; }
    .held { stroke: #8c959f; stroke-dasharray: 6 4; }
    .flow, .ssh, .held { fill: none; stroke-width: 1.6; }
    .k-flow { fill: #0969da; }
    .k-ssh { fill: #9a6700; }
    .k-held { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .grp { fill: #161b22; stroke: #30363d; }
      .box { fill: #0d1117; stroke: #6e7681; }
      .h, .g, .title { fill: #e6edf3; }
      .d { fill: #9198a1; }
      .flow { stroke: #4493f8; }
      .ssh { stroke: #d29922; }
      .held { stroke: #9198a1; }
      .k-flow { fill: #4493f8; }
      .k-ssh { fill: #d29922; }
      .k-held { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="m-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="k-flow" d="M0,0L10,5L0,10z"/></marker>
    <marker id="m-ssh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="k-ssh" d="M0,0L10,5L0,10z"/></marker>
    <marker id="m-held" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="k-held" d="M0,0L10,5L0,10z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="920"/>
  <text class="title" x="20" y="36">InvokeDB delivery: from pull request to production</text>
  <text class="d" x="20" y="58">Everything here runs on GitHub. What it deploys to: infrastructure-runtime.svg. Details: docs/OPERATIONS.md and each workflow's top comment.</text>

  <!-- Row A: the pull request -->
  <rect class="box" x="40" y="130" width="200" height="80" rx="6"/>
  <text class="h" x="52" y="152">Pull request</text>
  <text class="d" x="52" y="172">a branch per issue;</text>
  <text class="d" x="52" y="188">the agents' PRs too</text>

  <rect class="box" x="300" y="90" width="300" height="78" rx="6"/>
  <text class="h" x="312" y="112">CI (ci.yml)</text>
  <text class="d" x="312" y="132">backend, frontend, smoke, format, …</text>
  <text class="d" x="312" y="148">required: backend, frontend, format</text>

  <rect class="box" x="300" y="184" width="300" height="78" rx="6"/>
  <text class="h" x="312" y="206">Claude review (review.yml)</text>
  <text class="d" x="312" y="226">inline comments, then the label</text>
  <text class="d" x="312" y="242">review-ok or review-changes</text>

  <rect class="box" x="660" y="130" width="250" height="80" rx="6"/>
  <text class="h" x="672" y="152">automerge.yml</text>
  <text class="d" x="672" y="172">CI passed + review-ok → merge</text>
  <text class="d" x="672" y="188">held PRs → needs-owner</text>

  <rect class="box" x="960" y="130" width="220" height="80" rx="6"/>
  <text class="h" x="972" y="152">The owner</text>
  <text class="d" x="972" y="172">merges held PRs (hold, or</text>
  <text class="d" x="972" y="188">deploy/, .github/, migrations)</text>

  <path class="flow" marker-end="url(#m-flow)" d="M240,160 L300,129"/>
  <path class="flow" marker-end="url(#m-flow)" d="M240,180 L300,223"/>
  <path class="flow" marker-end="url(#m-flow)" d="M600,129 L660,160"/>
  <path class="flow" marker-end="url(#m-flow)" d="M600,223 L660,180"/>
  <path class="held" marker-end="url(#m-held)" d="M910,170 H960"/>

  <!-- merge into main -->
  <path class="flow" d="M1070,210 V290 H785"/>
  <path class="flow" marker-end="url(#m-flow)" d="M785,210 V290 H140 V320"/>
  <text class="d" x="300" y="284">merge into main</text>

  <!-- Row B: main to production -->
  <rect class="box" x="40" y="320" width="220" height="100" rx="6"/>
  <text class="h" x="52" y="342">CI on main</text>
  <text class="d" x="52" y="362">automerge starts it; its</text>
  <text class="d" x="52" y="378">deploy job starts cd.yml</text>
  <text class="d" x="52" y="394">once every job passed</text>

  <rect class="box" x="310" y="320" width="300" height="100" rx="6"/>
  <text class="h" x="322" y="342">CD (cd.yml, env production)</text>
  <text class="d" x="322" y="362">1. opens SSH on the Cloud Firewall</text>
  <text class="d" x="322" y="378">2. SSH: deploy &lt;sha&gt;</text>
  <text class="d" x="322" y="394">3. closes the firewall rule again</text>

  <rect class="box" x="660" y="320" width="250" height="100" rx="6"/>
  <text class="h" x="672" y="342">The droplet</text>
  <text class="d" x="672" y="362">ci-deploy.sh: only the tip of</text>
  <text class="d" x="672" y="378">main → release.sh: build,</text>
  <text class="d" x="672" y="394">migrate, restart</text>

  <rect class="box" x="960" y="320" width="220" height="100" rx="6"/>
  <text class="h" x="972" y="342">E2E (e2e.yml)</text>
  <text class="d" x="972" y="362">Playwright on invokedb.com</text>
  <text class="d" x="972" y="378">after each deploy + nightly</text>
  <text class="d" x="972" y="394">a failure → Telegram</text>

  <path class="flow" marker-end="url(#m-flow)" d="M260,370 H310"/>
  <path class="ssh" marker-end="url(#m-ssh)" d="M610,370 H660"/>
  <path class="flow" marker-end="url(#m-flow)" d="M910,370 H960"/>
  <text class="d" x="40" y="440">A failed CI or CD run starts repair.yml (below).</text>

  <!-- Around it -->
  <rect class="grp" x="30" y="460" width="1150" height="230" rx="8"/>
  <text class="g" x="44" y="482">Around it: workflows that open, fix and merge PRs</text>
  <text class="d" x="1166" y="482" text-anchor="end">Claude runs use the Claude GitHub App and CLAUDE_CODE_OAUTH_TOKEN</text>

  <rect class="box" x="45" y="496" width="268" height="86" rx="6"/>
  <text class="h" x="57" y="518">repair.yml</text>
  <text class="d" x="57" y="538">CI or CD failed → a claude/fix-*</text>
  <text class="d" x="57" y="554">PR, or an issue if it isn't the code</text>

  <rect class="box" x="329" y="496" width="268" height="86" rx="6"/>
  <text class="h" x="341" y="518">revise.yml</text>
  <text class="d" x="341" y="538">fixes or answers review-changes</text>
  <text class="d" x="341" y="554">on agent and repair PRs, 2 rounds</text>

  <rect class="box" x="613" y="496" width="268" height="86" rx="6"/>
  <text class="h" x="625" y="518">resolve.yml</text>
  <text class="d" x="625" y="538">merges main into conflicting</text>
  <text class="d" x="625" y="554">agent, repair and deps PRs</text>

  <rect class="box" x="897" y="496" width="268" height="86" rx="6"/>
  <text class="h" x="909" y="518">Project board (InvokeDB)</text>
  <text class="d" x="909" y="538">the issues in priority order;</text>
  <text class="d" x="909" y="554">the queue reads it (PROJECTS_TOKEN)</text>

  <rect class="box" x="45" y="594" width="268" height="86" rx="6"/>
  <text class="h" x="57" y="616">agent-queue + implement</text>
  <text class="d" x="57" y="636">the next agent-labelled issue, one</text>
  <text class="d" x="57" y="652">at a time → an agent-pr PR</text>

  <rect class="box" x="329" y="594" width="268" height="86" rx="6"/>
  <text class="h" x="341" y="616">security-fix.yml</text>
  <text class="d" x="341" y="636">every 3 h: CodeQL alerts →</text>
  <text class="d" x="341" y="652">security/* PRs or triage issues</text>

  <rect class="box" x="613" y="594" width="268" height="86" rx="6"/>
  <text class="h" x="625" y="616">deps-update.yml</text>
  <text class="d" x="625" y="636">monthly: every npm package →</text>
  <text class="d" x="625" y="652">two deps/* PRs (minor, majors)</text>

  <rect class="box" x="897" y="594" width="268" height="86" rx="6"/>
  <text class="h" x="909" y="616">Dependabot</text>
  <text class="d" x="909" y="636">npm security PRs and weekly</text>
  <text class="d" x="909" y="652">GitHub Actions updates</text>

  <!-- their PRs go through the same path -->
  <path class="flow" marker-end="url(#m-flow)" d="M30,575 H16 V170 H40"/>

  <!-- Secrets -->
  <rect class="grp" x="30" y="715" width="1150" height="190" rx="8"/>
  <text class="g" x="44" y="737">Secrets: names only, values never in the repo</text>

  <rect class="box" x="45" y="750" width="268" height="118" rx="6"/>
  <text class="h" x="57" y="772">Dropbox (the originals)</text>
  <text class="d" x="57" y="792">.env, deploy/prod.env, SSH key;</text>
  <text class="d" x="57" y="808">scripts/secrets.sh push / pull</text>

  <rect class="box" x="329" y="750" width="268" height="118" rx="6"/>
  <text class="h" x="341" y="772">Server: /opt/invokedb/prod.env</text>
  <text class="d" x="341" y="792">database passwords, BACKUP_*,</text>
  <text class="d" x="341" y="808">MAILGUN_*, GOOGLE_*, GITHUB_*,</text>
  <text class="d" x="341" y="824">TELEGRAM_*, HEALTHCHECK_URL;</text>
  <text class="d" x="341" y="840">copied by deploy.sh env / up</text>

  <rect class="box" x="613" y="750" width="268" height="118" rx="6"/>
  <text class="h" x="625" y="772">GitHub repo secrets</text>
  <text class="d" x="625" y="792">CLAUDE_CODE_OAUTH_TOKEN (also</text>
  <text class="d" x="625" y="808">a Dependabot secret),</text>
  <text class="d" x="625" y="824">PROJECTS_TOKEN, E2E_EMAIL,</text>
  <text class="d" x="625" y="840">E2E_PASSWORD, TELEGRAM_*</text>

  <rect class="box" x="897" y="750" width="268" height="118" rx="6"/>
  <text class="h" x="909" y="772">GitHub environment production</text>
  <text class="d" x="909" y="792">secrets: DEPLOY_SSH_KEY,</text>
  <text class="d" x="909" y="808">DO_FIREWALL_TOKEN; variables:</text>
  <text class="d" x="909" y="824">DEPLOY_HOST, DO_FIREWALL_ID,</text>
  <text class="d" x="909" y="840">DEPLOY_KNOWN_HOSTS</text>

  <text class="d" x="44" y="890">Also in dashboards: the Telegram token in the Cloudflare Worker's settings and in the Healthchecks webhook URL.</text>
</svg>
