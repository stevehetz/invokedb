<div class="audit-log">
    <p class="audit-log-intro">
        <template v-if="file"
            >Changes to this table's rows and columns, from this app and the
            API, newest first.</template
        >
        <template v-else
            >Changes to your tables, columns, rows and API keys, from this app
            and the API, newest first.</template
        >
        <span v-if="keep_days">Kept for {{ keep_days }} days.</span>
    </p>

    <div class="audit-log-status error" v-if="error">{{ error }}</div>
    <div
        class="audit-log-status"
        v-if="!loading && !error && entries.length === 0"
    >
        No changes yet.
    </div>

    <ul class="audit-log-list" v-if="entries.length > 0">
        <li class="audit-log-entry" v-for="e in entries" :key="e.id">
            <div class="audit-log-summary">
                {{ e.summary }}
                <span class="audit-log-table" v-if="!file && table_label(e)"
                    >in {{ table_label(e) }}</span
                >
            </div>
            <div class="audit-log-meta">
                <span class="audit-log-actor">
                    <i :class="actor_icon(e)"></i> {{ actor_label(e) }}
                </span>
                <span class="audit-log-time">{{ when(e.created_at) }}</span>
            </div>
        </li>
    </ul>

    <div class="audit-log-status" v-if="loading">Loading...</div>
    <div class="audit-log-more" v-if="next_cursor && !loading">
        <el-button size="small" @click="load(true)">Show older</el-button>
    </div>
</div>
