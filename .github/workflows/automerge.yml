# Merges repair.yml's fix PRs by itself, but only into feature branches: anything into main
# waits for a person (merging into main deploys). Runs after CI or Review finishes, so whichever
# finishes last does the merge. Merges only when all of these hold:
# - the branch is claude/fix-* and the PR was opened by the Claude app
# - the PR doesn't target main
# - the review labelled it review-ok
# - CI passed on the PR's current head commit
name: Auto-merge

on:
  workflow_run:
    workflows: [CI, Review]
    types: [completed]

permissions: {}

concurrency:
  group: automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automerge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'claude/fix-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write # start CI on the branch merged into
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Merge if every condition holds
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          pr=$(gh pr list -R "$R" --head "$BRANCH" --state open \
            --json number,baseRefName,headRefOid,author,labels --jq '.[0] // empty')
          [ -n "$pr" ] || { echo "No open PR for $BRANCH"; exit 0; }
          number=$(jq -r .number <<<"$pr")
          base=$(jq -r .baseRefName <<<"$pr")
          sha=$(jq -r .headRefOid <<<"$pr")
          author=$(jq -r .author.login <<<"$pr")

          if [ "$base" = main ]; then echo "PR #$number targets main: left for a person"; exit 0; fi
          if [ "$author" != app/claude ]; then echo "PR #$number wasn't opened by the Claude app"; exit 0; fi
          if ! jq -e '.labels | map(.name) | index("review-ok")' <<<"$pr" >/dev/null; then
            echo "PR #$number has no review-ok label (yet)"; exit 0
          fi
          passed=$(gh run list -R "$R" -w CI --commit "$sha" \
            --json conclusion --jq 'map(select(.conclusion == "success")) | length')
          if [ "$passed" -eq 0 ]; then echo "CI hasn't passed on $sha (yet)"; exit 0; fi

          gh pr merge "$number" -R "$R" --merge --match-head-commit "$sha"
          gh api -X DELETE "repos/$R/git/refs/heads/$BRANCH" >/dev/null
          echo "Merged PR #$number into $base"
          # A merge made with the workflow token doesn't start workflows
          gh workflow run ci.yml -R "$R" --ref "$base"
