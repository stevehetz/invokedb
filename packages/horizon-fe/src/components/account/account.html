<div class="page account-page">
    <div class="page-body">
        <nav class="account-nav" aria-label="Account sections">
            <router-link
                v-for="s in sections"
                :key="s.id"
                :to="{ query: { section: s.id } }"
                :class="['account-nav-item', 'account-nav-' + s.id, { active: section === s.id }]"
                :aria-current="section === s.id ? 'page' : undefined"
            >
                <i :class="['fa', s.icon]"></i>
                <span>{{ s.label }}</span>
            </router-link>
        </nav>
        <div :class="['account-section', 'account-section-' + section]">
            <!-- The no-signup demo (#333): what's off says so instead -->
            <template v-if="section === 'usage'">
                <demo-off
                    v-if="demo"
                    text="Plans and billing are off in the demo, which has its own small limits."
                ></demo-off>
                <subscription-form :account="account"></subscription-form>
            </template>
            <template v-else-if="section === 'api-keys'">
                <demo-off
                    v-if="demo"
                    text="API keys and the MCP server are off in the demo."
                ></demo-off>
                <api-key-form v-else></api-key-form>
            </template>
            <template v-else-if="section === 'profile'">
                <account-info-form :account="account"></account-info-form>
            </template>
            <template v-else-if="section === 'security'">
                <demo-off
                    v-if="demo"
                    text="A demo has no password, and two-factor sign-in is off in it."
                ></demo-off>
                <template v-else>
                    <change-password-form></change-password-form>
                    <two-factor-form></two-factor-form>
                </template>
            </template>
            <template v-else-if="section === 'history'">
                <div class="page-form audit-log-form">
                    <div class="form-heading">
                        <h3>History</h3>
                    </div>
                    <div class="form-body">
                        <audit-log :props="{}"></audit-log>
                    </div>
                </div>
            </template>
            <template v-else-if="section === 'data'">
                <demo-off
                    v-if="demo"
                    text="Data export is off in the demo, and it deletes itself 24 hours after it's made."
                ></demo-off>
                <template v-else>
                    <data-export-form></data-export-form>
                    <delete-account-form
                        :account="account"
                    ></delete-account-form>
                </template>
            </template>
        </div>
    </div>
</div>
