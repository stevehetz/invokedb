<div class="page home-page">
    <div class="page-overlay hidden">
        <router-view name="page_overlay"></router-view>
    </div>
    <div class="left-pane split split-horizontal">
        <h-tree
            ref="h_tree"
            :tree_items="tree_items"
            @tree_item_selected="tree_item_selected"
            @add_tree_item="add_tree_item"
            @remove_tree_items="remove_tree_items"
            @edit_tree_items="edit_tree_items"
            @move_tree_item="move_tree_item"
        >
        </h-tree>
    </div>
    <div class="right-pane split split-horizontal">
        <el-tabs
            v-model="active_tab_name"
            type="card"
            v-if="tabs.length > 0"
            @tab-remove="remove_tab"
            @tab-click="tab_clicked"
            closable
        >
            <el-tab-pane v-for="item in tabs" :key="item.id" :name="item.name">
                <template #label>
                    <span
                        v-if="tab_icon(item.name)"
                        v-html="tab_icon(item.name)"
                    ></span>
                    {{ tab_label(item.name) }}
                </template>
                <doc-container
                    :file="item"
                    :file_directory_id="item.id"
                    :web_file_type="item.web_file_type"
                ></doc-container>
            </el-tab-pane>
        </el-tabs>
    </div>
    <onboarding
        :tree_items="tree_items"
        @add_table="type => add_tree_item(type, null)"
    ></onboarding>
</div>
