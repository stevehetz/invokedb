# When CI or CD fails on a branch of this repo (never a fork's), Claude reads the failed jobs'
# logs and either opens a pull request with a fix (on a new claude/fix-... branch, targeting the
# branch that failed; it never pushes to main), or, when the cause isn't in the code (e.g. the
# deploy couldn't reach the server), opens an issue with its diagnosis. Runs on claude/ branches
# are skipped, so a failing fix can't start a loop. Auth as in review.yml.
name: Repair

on:
  workflow_run:
    workflows: [CI, CD]
    types: [completed]

permissions: {}

concurrency:
  group: repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # read the failed logs; start CI on the fix branch
      id-token: write
    env:
      FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
      FAILED_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_RUN: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Kept inside .git so it can never be committed
      - name: Collect the failed jobs' logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} -R "$GITHUB_REPOSITORY" --log-failed \
            | tail -c 80000 > .git/failed-run.log
          wc -c .git/failed-run.log
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            The "${{ env.FAILED_WORKFLOW }}" workflow failed on branch `${{ env.FAILED_BRANCH }}`
            at commit ${{ env.FAILED_SHA }} (${{ env.FAILED_RUN }}). That commit is checked
            out. The failed jobs' logs (the last 80 kB) are in .git/failed-run.log.

            Read AGENTS.md first (project rules), then .github/workflows/ for what the failed
            job runs. Find the root cause from the logs and the code.

            If the cause is in this repo's code or config and you can fix it:
            1. `git switch -c claude/fix-${{ github.event.workflow_run.id }}`
            2. Make the smallest fix. Reproduce the failing command where you can (CI runs
               `npm ci` + build + lint in packages/horizon-be with --omit=optional, the same in
               packages/horizon-fe, and `npx prettier --check .` at the root after
               `npm ci --ignore-scripts`) and check it now passes.
            3. Run `npx prettier --write` on the files you changed, commit with a clear
               message, and `git push -u origin HEAD`.
            4. `gh pr create --base ${{ env.FAILED_BRANCH }}` with a title starting
               "Fix ${{ env.FAILED_WORKFLOW }}:" and a body giving the cause, the fix, how you
               checked it, and a link to the failed run.

            If the cause is outside the code (the server, the firewall, DNS, GitHub, a
            dependency registry, a flaky network call) or you can't fix it safely, change no
            files and open an issue with `gh issue create` titled
            "${{ env.FAILED_WORKFLOW }} failed on ${{ env.FAILED_BRANCH }}: <short cause>",
            with your diagnosis, the evidence from the logs, and what a person should do.

            Never push to main or to `${{ env.FAILED_BRANCH }}` directly, never touch secrets
            or deploy/prod.env, and never weaken a check (skip a lint rule, delete a test,
            loosen CI) to make it pass. Add no AI attribution anywhere: no Co-Authored-By
            trailer in commits and no "Generated with" line in the PR or issue.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(gh pr create:*),Bash(gh issue create:*),Bash(gh run view:*)"

      # Pushes made with the workflow token don't start workflows, so start CI on the fix branch
      # here (workflow_dispatch is the exception). Its checks attach to the commit and show on
      # the PR, which the merge rule needs.
      - name: Run CI on the fix branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: claude/fix-${{ github.event.workflow_run.id }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH"
            echo "Started CI on $BRANCH"
          else
            echo "No fix branch (Claude opened an issue or made no change)"
          fi
