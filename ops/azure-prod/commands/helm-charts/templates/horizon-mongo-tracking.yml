apiVersion: v1
kind: Service
metadata:
  name: horizon-mongo-tracking
  labels:
    run: horizon-mongo-tracking
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.HORIZON_MONGO_TRACKING_HOST }}
  ports:
  - port: {{ .Values.HORIZON_MONGO_TRACKING_PORT }}
    targetPort: 27017
  selector:
    run: horizon-mongo-tracking
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-mongo-tracking
spec:
  replicas: {{ .Values.mongoTracking.replicas }}
  selector:
    matchLabels:
      run: horizon-mongo-tracking
  template:
    metadata:
      labels:
        run: horizon-mongo-tracking
    spec:
      containers:
      - name: horizon-mongo-tracking
        image: mongo
        resources:
          requests:
            cpu: {{ .Values.mongoTracking.resources.requests.cpu }}
            memory: {{ .Values.mongoTracking.resources.requests.memory }}
          limits:
            cpu: {{ .Values.mongoTracking.resources.limits.cpu }}
            memory: {{ .Values.mongoTracking.resources.limits.memory }}
        ports:
        - containerPort: 27017
        env:
        - name: HORIZON_FILE_SHARE
          value: "{{ .Values.HORIZON_FILE_SHARE }}"
        volumeMounts:
        - name: fileshare
          mountPath: /data/share
      volumes:
      - name: fileshare
        azureFile:
          secretName: prod-horizon-share-sec
          shareName: prodhorizonfileshare
          readOnly: false
      tolerations:
      - key: "sku"
        operator: "Equal"
        value: "cl"
        effect: "NoSchedule"