# Deploys main to production after CI passes on it (deploy/README.md, "Automatic deploys").
# Opens SSH on the DigitalOcean firewall to this runner's IP only for the length of the deploy,
# then sends `deploy <sha>` with a key that can do nothing else (deploy/ci-deploy.sh). Ships code
# only: prod.env stays on the server (change it with `deploy.sh env` from the Mac).
# Two triggers, both only after CI passed on main:
# - workflow_run: CI finished after a push to main (a merge made with a person's login)
# - workflow_dispatch from CI's `deploy` job: CI was started by automerge.yml after its merge.
#   GitHub sends no workflow_run event for runs started with the workflow token, so CI starts
#   this itself, with the commit it checked.
# ci-deploy.sh only deploys the current tip of main either way.
# After a successful deploy it starts e2e.yml against production with the deployed commit (#90).
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main that passed CI
        required: true

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://invokedb.com
    timeout-minutes: 30
    permissions:
      actions: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      FIREWALL_RULES: https://api.digitalocean.com/v2/firewalls/${{ vars.DO_FIREWALL_ID }}/rules
      DO_TOKEN: ${{ secrets.DO_FIREWALL_TOKEN }}
    steps:
      - name: Open SSH to this runner
        run: |
          ip=$(curl -4 -fsS https://api.ipify.org)
          rule="{\"inbound_rules\":[{\"protocol\":\"tcp\",\"ports\":\"22\",\"sources\":{\"addresses\":[\"$ip/32\"]}}]}"
          echo "SSH_RULE=$rule" >> "$GITHUB_ENV"
          curl -fsS -X POST "$FIREWALL_RULES" -H "Authorization: Bearer $DO_TOKEN" \
            -H 'Content-Type: application/json' -d "$rule"
          # The rule takes a few seconds to apply
          for i in $(seq 30); do
            timeout 3 bash -c "</dev/tcp/$DEPLOY_HOST/22" 2>/dev/null && exit 0
            sleep 2
          done
          echo '::error::SSH still unreachable after opening the firewall'
          exit 1

      - name: Deploy ${{ env.SHA }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 "root@$DEPLOY_HOST" "deploy $SHA"

      - name: Close SSH again
        if: always() && env.SSH_RULE != ''
        run: |
          curl -fsS -X DELETE "$FIREWALL_RULES" -H "Authorization: Bearer $DO_TOKEN" \
            -H 'Content-Type: application/json' -d "$SSH_RULE"

      # Workflow-token runs start no workflows by themselves; workflow_dispatch is the exception
      - name: Start the end-to-end test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run e2e.yml -R "$GITHUB_REPOSITORY" --ref main -f sha="$SHA"
