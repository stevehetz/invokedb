<div class="dialog alert-dialog">
    <el-dialog
        :title="title"
        v-model="dialog_visible"
        @close="close_handler"
        width="500px"
    >
        <span>{{ message }}</span>
        <template #footer
            ><span class="dialog-footer">
                <el-button type="primary" @click="dialog_visible = false;"
                    >Ok</el-button
                >
            </span></template
        >
    </el-dialog>
</div>
