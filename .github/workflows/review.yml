# A caller of stevehetzl/agent-pipeline's review.yml (#4 there); its behaviour is documented in that
# file. InvokeDB's settings are the `with:` inputs below.
name: Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: stevehetzl/agent-pipeline/.github/workflows/review.yml@v1
    with:
      focus: |
        - account scoping in backend routes: the caller's account from the session or API key, never from the query or body (see AGENTS.md)
        - deploy/ and database migrations (a shipped migration must never be edited)
        - a new feature that reaches outside or outlives a demo account needs the demo guard (AGENTS.md, "No-signup demo")
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
