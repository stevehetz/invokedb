<div class="page checkout-page">
    <div class="loading" v-if="loading">Loading...</div>
    <div class="main-heading" v-if="!loading">
        <div class="flex-row">
            <div class="col col-25">
                <router-link class="title-link" to="/">
                    <img
                        class="heading-logo-title"
                        v-bind:src="require('@/assets/logo-title.svg')"
                    />
                    <img
                        class="heading-logo-icon"
                        v-bind:src="require('@/assets/logo.svg')"
                    />
                </router-link>
            </div>
            <div class="col col-75 pull-right">
                <router-link to="/contact">Contact</router-link>
                <router-link to="/pricing">Pricing</router-link>
                <router-link to="/create-account" v-if="!account"
                    >Sign Up</router-link
                >
                <router-link to="/login" class="sign-in" v-if="!account">
                    <span>Sign In</span>
                    <i class="fa fa-arrow-right"></i>
                </router-link>
                <a
                    href=""
                    class="sign-in"
                    v-if="account"
                    @click="go_to_database"
                >
                    <span>Database</span>
                    <i class="fa fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>
    <div class="main-body">
        <div class="main-body-wrapper">
            <div class="panel-box" v-if="!loading">
                <div class="top">
                    <h3 class="panel-title">Subscription checkout</h3>
                    <div class="plan-tier">
                        <label> Plan Tier </label>
                        <el-select
                            class="plan-tier__select"
                            v-model="selected_tier"
                            :disabled="processing"
                        >
                            <el-option
                                v-for="plan_tier in plan_tiers"
                                :key="plan_tier.id"
                                :label="plan_tier.name"
                                :value="plan_tier.id"
                            >
                            </el-option>
                        </el-select>
                    </div>
                    <form
                        id="subscription-form"
                        class="subscription-form"
                        :class="{disabled: processing}"
                    >
                        <div class="overlay"></div>
                        <label> Enter your payment details </label>
                        <div
                            id="card-element"
                            class="stripe-card-element"
                        ></div>

                        <div class="messages">
                            <div
                                id="card-errors"
                                class="card-errors"
                                role="alert"
                            ></div>

                            <div class="processing-message" v-if="processing">
                                <span class="processing-message__text"
                                    >Processing Payment...</span
                                >
                                <span
                                    class="processing-message__spinner"
                                    v-loading="true"
                                ></span>
                            </div>
                        </div>

                        <button
                            ref="submit_payment"
                            style="display: none"
                            type="submit"
                            class="subscribe-button"
                        >
                            Subscribe
                        </button>
                    </form>
                </div>
                <div class="bottom">
                    <div class="error-box">
                        <div class="error-message" v-if="error.message !== ''">
                            <i class="fa fa-exclamation-triangle"></i>
                            <span>{{ error.message }}</span>
                        </div>
                    </div>
                    <div class="control-box">
                        <div class="flex-2-col">
                            <div class="left"></div>
                            <div class="right">
                                <a
                                    href=""
                                    class="submit-button"
                                    :class="{disabled: processing}"
                                    @click="submit($event)"
                                    >Submit <i class="fa fa-arrow-right"></i
                                ></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
