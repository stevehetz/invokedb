events {
  worker_connections  4096;
}

http {
  include mime.types;
  client_max_body_size 1000M;

  server {
    listen              3000;
    server_name         fs.invokedb.com;
    

    location / {
      proxy_buffering off;
      proxy_pass  http://${HORIZON_FS_PRIV_HTTP_HOST}:${HORIZON_FS_PRIV_HTTP_PORT};
    }
  }
}