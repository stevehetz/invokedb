# A caller of stevehetzl/agent-pipeline's deps-update.yml (#4 there); its behaviour is documented in that
# file. InvokeDB's settings are the `with:` inputs below.
name: Monthly dependency updates

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: deps-update
  cancel-in-progress: false

jobs:
  update:
    uses: stevehetzl/agent-pipeline/.github/workflows/deps-update.yml@v1
    with:
      node_version_file: .nvmrc
      projects: '`.` (root tools), `packages/horizon-be` (install with --omit=optional: no native packages), `packages/horizon-fe`, `examples/invokedb-node`, `examples/angular`'
      groups: |
        Angular packages with each other and the TypeScript they need; `@nestjs/*`.
      checks: |
        `npm ci` at the root (its postinstall installs both packages), then `npm run check`
        from the root. It must pass: backend build, lint and unit tests; frontend build, lint
        and typecheck; both example builds; shellcheck; prettier. CI's smoke test runs on the
        PR. Format the files you changed with `npx prettier --write` (root).
      never: |
        Never touch deploy/prod.env, never run deploy/deploy.sh or the smoke scripts (scripts/api-smoke.mjs, scripts/ui-smoke.mjs), and never edit a database migration that has already shipped.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
