<div class="layout">
    <div class="header">
        <div class="left">
            <div class="logo">
                <img src="@/assets/logo.svg" />
                <div class="cover" v-if="active_index === '/app'"></div>
            </div>
            <el-menu
                class="nav"
                ref="nav"
                mode="horizontal"
                :ellipsis="false"
                :default-active="active_index"
                @select="nav_selected"
            >
                <el-menu-item
                    index="/app"
                    :class="{'is-active2': active_index === '/app'}"
                >
                    <i class="menu-icon fa fa-table"></i>
                    <span class="menu-text">Tables</span>
                </el-menu-item>
                <el-menu-item
                    index="/app/api"
                    :class="{'is-active2': active_index === '/app/api'}"
                >
                    <i class="menu-icon fa fa-file-code"></i>
                    <span class="menu-text">Api</span>
                </el-menu-item>
                <el-menu-item
                    index="/app/guide"
                    :class="{'is-active2': active_index === '/app/guide'}"
                >
                    <i class="menu-icon fa fa-file-alt"></i>
                    <span class="menu-text">Guide</span>
                </el-menu-item>
            </el-menu>
        </div>
        <div class="right">
            <router-link
                class="header-link help-link"
                to="/help"
                title="Help"
                aria-label="Help"
            >
                <i class="header-icon fa fa-circle-question"></i>
            </router-link>
            <!-- The account menu: everything about the account, at the top right -->
            <el-dropdown
                class="account-menu"
                trigger="click"
                placement="bottom-end"
                popper-class="account-menu-popper"
                @command="account_command"
                v-if="account"
            >
                <button
                    type="button"
                    :class="['account-menu-button', { active: active_index === '/app/account' }]"
                    aria-label="Account menu"
                >
                    <span class="account-avatar">{{ initial }}</span>
                    <span class="account-email">{{ account.email }}</span>
                    <i class="fa fa-caret-down account-caret"></i>
                </button>
                <template #dropdown>
                    <div class="account-menu-head">
                        <div class="account-menu-email">
                            {{ account.email }}
                        </div>
                        <div class="account-menu-plan">{{ plan_name }}</div>
                    </div>
                    <el-dropdown-menu>
                        <el-dropdown-item
                            class="account-menu-settings"
                            command="settings"
                            divided
                        >
                            <i class="fa fa-cog"></i> Account settings
                        </el-dropdown-item>
                        <el-dropdown-item
                            class="account-menu-contact"
                            command="contact"
                        >
                            <i class="fa fa-envelope"></i> Contact support
                        </el-dropdown-item>
                        <el-dropdown-item
                            class="account-menu-signout"
                            command="logout"
                            divided
                        >
                            <i class="fa fa-sign-out-alt"></i> Sign out
                        </el-dropdown-item>
                    </el-dropdown-menu>
                </template>
            </el-dropdown>
        </div>
    </div>
    <div
        class="verify-email-banner"
        v-if="account && account.email_verified === false"
    >
        <i class="fa fa-envelope"></i>
        <span>
            Confirm your email address to create tables and use your API key. We
            sent a link to <b>{{ account.email }}</b>.
        </span>
        <span v-if="resend.sent" class="done">Sent. Check your inbox.</span>
        <a v-else href="" @click.prevent="resend_verification">
            {{ resend.sending ? 'Sending…' : 'Resend the email' }}
        </a>
        <span v-if="resend.error" class="error">{{ resend.error }}</span>
    </div>
    <div class="body">
        <slot class="body-container" name="body">404 - Route not found</slot>
    </div>
</div>
