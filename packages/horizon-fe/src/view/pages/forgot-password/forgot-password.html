<div class="page forgot-password-page">
    <div class="main-heading">
        <div class="flex-row">
            <div class="col col-25">
                <router-link class="title-link" to="/">
                    <img
                        class="heading-logo-title"
                        v-bind:src="require('@/assets/logo-title.svg')"
                    />
                    <img
                        class="heading-logo-icon"
                        v-bind:src="require('@/assets/logo.svg')"
                    />
                </router-link>
            </div>
            <div class="col col-75 pull-right">
                <div class="col col-75 pull-right">
                    Don't have an account?
                    <router-link to="/create-account" class="sign-in">
                        <span>Sign Up</span>
                        <i class="fa fa-arrow-right"></i>
                    </router-link>
                </div>
            </div>
        </div>
    </div>
    <div class="main-body">
        <div class="main-body-wrapper">
            <div class="panel-box">
                <div class="top">
                    <h4 class="panel-title">
                        Submit your email to create a new password
                    </h4>
                    <div v-if="message === ''" class="input-box">
                        <el-input
                            v-model="email"
                            placeholder="Email"
                            @keyup.enter.native="send"
                            ref="email"
                        ></el-input>
                    </div>
                    <div v-if="message !== ''" class="forgot-password-message">
                        <p>{{ message }}</p>
                    </div>
                </div>
                <div class="bottom">
                    <div class="error-box">
                        <div class="error-message" v-if="error.message !== ''">
                            <i class="fa fa-exclamation-triangle"></i>
                            <span>{{ error.message }}</span>
                        </div>
                    </div>
                    <div class="control-box">
                        <div class="flex-2-col">
                            <div class="left">
                                <router-link to="/login">Login</router-link>
                            </div>
                            <div v-if="message === ''" class="right">
                                <a
                                    href=""
                                    class="send-button"
                                    @click="send($event)"
                                    >Send <i class="fa fa-arrow-right"></i
                                ></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
