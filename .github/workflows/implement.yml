# A caller of stevehetzl/agent-pipeline's implement.yml (#4 there); its behaviour is documented in that
# file. InvokeDB's settings are the `with:` inputs below.
name: Implement

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: implement
  cancel-in-progress: false

jobs:
  implement:
    uses: stevehetzl/agent-pipeline/.github/workflows/implement.yml@v1
    with:
      issue: ${{ inputs.issue }}
      node_version_file: .nvmrc
      checks: |
        Install what you need: `npm ci --omit=optional --no-audit --no-fund` in packages/horizon-be, `npm ci --no-audit --no-fund` in packages/horizon-fe, `npm ci --ignore-scripts --no-audit --no-fund` at the root.
        Backend: `npm run build`, `npm run lint`, `npm test`. Frontend: `npm run build`, `npm run lint`, `npm run typecheck`.
        There are no databases here; CI's `smoke` job runs the API smoke test on the PR.
        From the root, `npx prettier --write` the files you changed.
      never: |
        Never touch deploy/prod.env, never run deploy/deploy.sh or the smoke scripts (scripts/api-smoke.mjs, scripts/ui-smoke.mjs), and never edit a database migration that has already shipped.
      project_number: 1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
