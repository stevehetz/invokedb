<div class="link-dialog">
    <div class="link-status" v-if="loading">Loading...</div>
    <div class="link-status error" v-if="error">{{ error }}</div>

    <template v-if="is_settings && !loading">
        <p class="link-intro">
            A link column holds rows of another of your tables (or this one).
            The grid shows each linked row by one of its columns; the API
            returns their <code>_id</code>s, or the whole rows with
            <code>expand=&lt;column&gt;</code>.
        </p>
        <div class="link-row">
            <label>Links to table</label>
            <el-select
                class="link-table-select"
                v-model="table_id"
                placeholder="Choose a table"
                filterable
                @change="table_changed"
            >
                <el-option
                    v-for="t in tables"
                    :key="t.id"
                    :label="t.name"
                    :value="t.id"
                ></el-option>
            </el-select>
        </div>
        <div class="link-row">
            <label>Show rows by</label>
            <el-select
                class="link-display-select"
                v-model="display_field"
                placeholder="Choose a column"
                :disabled="!table_id || table_columns.length === 0"
            >
                <el-option
                    v-for="c in table_columns"
                    :key="c.field"
                    :label="c.headerName"
                    :value="c.field"
                ></el-option>
            </el-select>
        </div>

        <!-- Fill links by matching (#321): only for a column saved as a link to this table -->
        <div class="link-match" v-if="table_id">
            <h4>Fill links by matching</h4>
            <p class="link-match-note" v-if="!can_match">
                Save the column first: click <b>Save</b> here, then save your
                column changes. Then open this column's link settings again (its
                type menu → Link) to fill its empty cells by matching a column
                of each table.
            </p>
            <template v-else>
                <p class="link-match-note">
                    Links each row whose cell is empty to every row of
                    <b>{{ target_table_name }}</b> with the same value. Text is
                    compared ignoring case and spaces at either end; empty
                    values never match. Cells that already hold links are left
                    as they are.
                </p>
                <div class="link-row">
                    <label>This table's</label>
                    <el-select
                        class="link-match-source"
                        v-model="source_field"
                        placeholder="Choose a column"
                        @change="match_changed"
                    >
                        <el-option
                            v-for="c in source_columns"
                            :key="c.field"
                            :label="c.headerName"
                            :value="c.field"
                        ></el-option>
                    </el-select>
                </div>
                <div class="link-row">
                    <label>Matches its</label>
                    <el-select
                        class="link-match-target"
                        v-model="target_field"
                        placeholder="Choose a column"
                        @change="match_changed"
                    >
                        <el-option
                            v-for="c in target_columns"
                            :key="c.field"
                            :label="c.headerName"
                            :value="c.field"
                        ></el-option>
                    </el-select>
                </div>
                <div class="link-match-result" v-if="match_counts">
                    {{ match_summary }}
                </div>
                <div class="link-match-done" v-if="match_done">
                    {{ match_done }}
                </div>
                <div class="link-match-actions">
                    <el-button
                        class="link-match-find"
                        @click="find_matches"
                        :disabled="!can_find"
                        :loading="matching && !match_counts"
                    >
                        Find matches
                    </el-button>
                    <el-button
                        type="primary"
                        class="link-match-apply"
                        @click="apply_matches"
                        :disabled="!can_apply"
                        :loading="matching && !!match_counts"
                    >
                        Link rows
                    </el-button>
                </div>
            </template>
        </div>
    </template>

    <template v-if="!is_settings && !loading">
        <p class="link-intro">
            Pick the rows of <b>{{ table_name }}</b> this cell links to<span
                v-if="display_name"
            >
                (shown by <b>{{ display_name }}</b>)</span
            >. Type to search. Choose rows, then <b>Save</b>.
        </p>
        <!-- Room below the select for its row list, so the list never covers Save -->
        <div class="link-pick">
            <!-- Above the select: its open list would cover anything below it -->
            <div class="link-status link-no-match" v-if="no_match">
                {{ no_match_text }}
            </div>
            <el-select
                class="link-row-select"
                popper-class="link-row-popper"
                placement="bottom-start"
                v-model="chosen"
                multiple
                filterable
                remote
                :remote-method="search"
                :loading="searching"
                :no-data-text="no_match_text"
                :no-match-text="no_match_text"
                placeholder="Search rows"
            >
                <el-option
                    v-for="o in options"
                    :key="o._id"
                    :label="o.label"
                    :value="o._id"
                ></el-option>
            </el-select>
        </div>
    </template>

    <div class="link-actions">
        <el-button @click="cancel" :disabled="saving">Cancel</el-button>
        <el-button
            type="primary"
            class="link-save"
            @click="save"
            :disabled="!can_save"
        >
            Save
        </el-button>
    </div>
</div>
