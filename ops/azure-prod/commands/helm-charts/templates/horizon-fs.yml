apiVersion: v1
kind: Service
metadata:
  name: horizon-fs
  labels:
    run: horizon-fs
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.HORIZON_FS_PRIV_HTTP_HOST }}
  ports:
  - port: {{ .Values.HORIZON_FS_PRIV_HTTP_PORT }}
    targetPort: {{ .Values.HORIZON_FS_PRIV_HTTP_PORT }}
  selector:
    run: horizon-fs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-fs
spec:
  replicas: {{ .Values.fs.replicas }}
  selector:
    matchLabels:
      run: horizon-fs
  template:
    metadata:
      labels:
        run: horizon-fs
    spec:
      containers:
      - name: horizon-fs
        image: {{ .Values.be.image }}
        resources:
          requests:
            cpu: {{ .Values.fs.resources.requests.cpu }}
            memory: {{ .Values.fs.resources.requests.memory }}
        env:
        - name: ENV
          value: "{{ .Values.ENV }}"
        - name: IS_HORIZON_FS
          value: "true"
        - name: SLACK_LOG_LEVEL
          value: "{{ .Values.SLACK_LOG_LEVEL }}"
        - name: POSTGRES_LOG_LEVEL
          value: "{{ .Values.POSTGRES_LOG_LEVEL }}"
        - name: SLACK_WEBHOOK_URL
          value: "{{ .Values.SLACK_WEBHOOK_URL }}"
        - name: HORIZON_ENV_LOADED
          value: "{{ .Values.HORIZON_ENV_LOADED }}"
        - name: HORIZON_SB_PRIV_WS_URL
          value: "{{ .Values.HORIZON_SB_PRIV_WS_URL }}"
        - name: HORIZON_AUTH_FE_PUB_HTTP_URL
          value: "{{ .Values.HORIZON_AUTH_FE_PUB_HTTP_URL }}"
        - name: HORIZON_FILE_SHARE
          value: "{{ .Values.HORIZON_FILE_SHARE }}"
        - name: HORIZON_POSTGRES_HOST
          value: "{{ .Values.HORIZON_POSTGRES_HOST }}"
        - name: HORIZON_POSTGRES_PORT
          value: "{{ .Values.HORIZON_POSTGRES_PORT }}"
        - name: HORIZON_POSTGRES_DB
          value: "{{ .Values.HORIZON_POSTGRES_DB }}"
        - name: HORIZON_POSTGRES_USERNAME
          value: "{{ .Values.HORIZON_POSTGRES_USERNAME }}"
        - name: HORIZON_POSTGRES_PASSWORD
          value: "{{ .Values.HORIZON_POSTGRES_PASSWORD }}"
        - name: HORIZON_MONGO_DB
          value: "{{ .Values.HORIZON_MONGO_DB }}"
        - name: HORIZON_MONGO_URI
          value: "{{ .Values.HORIZON_MONGO_URI }}"
        - name: HORIZON_MONGO_PORT
          value: "{{ .Values.HORIZON_MONGO_PORT }}"
        - name: HORIZON_MONGO_TRACKING_DB
          value: "{{ .Values.HORIZON_MONGO_TRACKING_DB }}"
        - name: HORIZON_MONGO_TRACKING_URI
          value: "{{ .Values.HORIZON_MONGO_TRACKING_URI }}"
        - name: HORIZON_MONGO_TRACKING_PORT
          value: "{{ .Values.HORIZON_MONGO_TRACKING_PORT }}"
        - name: HORIZON_FS_PRIV_HTTP_PORT
          value: "{{ .Values.HORIZON_FS_PRIV_HTTP_PORT }}"
        - name: HORIZON_BE_PRIV_HTTP_PORT
          value: "{{ .Values.HORIZON_BE_PRIV_HTTP_PORT }}"
        - name: HORIZON_PRC_HTTP_PATH
          value: "{{ .Values.HORIZON_PRC_HTTP_PATH }}"
        - name: HORIZON_PRC_PRIV_HTTP_PORT
          value: "{{ .Values.HORIZON_PRC_PRIV_HTTP_PORT }}"
        - name: MAILGUN_SMTP_HOSTNAME
          value: "{{ .Values.MAILGUN_SMTP_HOSTNAME }}"
        - name: MAILGUN_SMTP_LOGIN
          value: "{{ .Values.MAILGUN_SMTP_LOGIN }}"
        - name: MAILGUN_API_KEY
          value: "{{ .Values.MAILGUN_API_KEY }}"
        - name: MAILGUN_PW
          value: "{{ .Values.MAILGUN_PW }}"
        - name: MAILGUN_API_URL
          value: "{{ .Values.MAILGUN_API_URL }}"
        - name: MAILGUN_DN
          value: "{{ .Values.MAILGUN_DN }}"
        ports:
        - containerPort: {{ .Values.HORIZON_FS_PRIV_HTTP_PORT }}
        volumeMounts:
        - name: fileshare
          mountPath: /data/share
      volumes:
      - name: fileshare
        azureFile:
          secretName: prod-horizon-share-sec
          shareName: prodhorizonfileshare
          readOnly: false
      tolerations:
      - key: "sku"
        operator: "Equal"
        value: "fs"
        effect: "NoSchedule"