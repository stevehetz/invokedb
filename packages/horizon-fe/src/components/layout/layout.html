<div class="layout">
    <div class="header">
        <div class="left">
            <div class="logo">
                <img src="@/assets/logo.svg" />
                <div class="cover" v-if="active_index === '/app'"></div>
            </div>
            <el-menu
                class="nav"
                ref="nav"
                mode="horizontal"
                :ellipsis="false"
                :default-active="active_index"
                @select="nav_selected"
            >
                <el-menu-item
                    index="/app"
                    :class="{'is-active2': active_index === '/app'}"
                >
                    <i class="menu-icon fa fa-table"></i>
                    <span class="menu-text">Tables</span>
                </el-menu-item>
                <el-menu-item
                    index="/app/api"
                    :class="{'is-active2': active_index === '/app/api'}"
                >
                    <i class="menu-icon fa fa-file-code"></i>
                    <span class="menu-text">Api</span>
                </el-menu-item>
                <el-menu-item
                    index="/app/guide"
                    :class="{'is-active2': active_index === '/app/guide'}"
                >
                    <i class="menu-icon fa fa-file-alt"></i>
                    <span class="menu-text">Guide</span>
                </el-menu-item>
                <el-menu-item
                    index="/app/account"
                    :class="{'is-active2': active_index === '/app/account'}"
                >
                    <i class="menu-icon fa fa-user"></i>
                    <span class="menu-text">Account</span>
                </el-menu-item>
            </el-menu>
        </div>
        <div class="right">
            <!-- <el-menu class="nav"
                     ref="nav2"
                     mode="horizontal"
                     @select="nav_selected">
                <el-menu-item index="/app/account"
                              class="account-menu-item"
                              :class="{'is-active2': active_index === '/app/account'}"
                              v-if="account">
                    <i class="el-icon-user"></i>
                    <span class="menu-text">{{ account.email }}</span>
                </el-menu-item>
            </el-menu> -->
            <div class="header-text" v-if="account">
                <span>{{ account.email }}</span>
            </div>
            <div class="header-link" @click="contact">
                <i class="header-icon fa fa-user-edit"></i>
            </div>
            <div class="header-link" @click="logout">
                <i class="header-icon fa fa-sign-out-alt"></i>
            </div>
        </div>
    </div>
    <div
        class="verify-email-banner"
        v-if="account && account.email_verified === false"
    >
        <i class="fa fa-envelope"></i>
        <span>
            Confirm your email address to create tables and use your API key. We
            sent a link to <b>{{ account.email }}</b>.
        </span>
        <span v-if="resend.sent" class="done">Sent. Check your inbox.</span>
        <a v-else href="" @click.prevent="resend_verification">
            {{ resend.sending ? 'Sending…' : 'Resend the email' }}
        </a>
        <span v-if="resend.error" class="error">{{ resend.error }}</span>
    </div>
    <div class="body">
        <slot class="body-container" name="body">404 - Route not found</slot>
    </div>
</div>
