<div class="page changelog-page">
    <div class="main-content">
        <div class="main-heading">
            <div class="flex-row">
                <div class="col col-25">
                    <router-link class="title-link" to="/">
                        <img
                            class="heading-logo-title"
                            src="@/assets/logo-title.svg"
                        />
                        <img
                            class="heading-logo-icon"
                            src="@/assets/logo.svg"
                        />
                    </router-link>
                </div>
                <div class="col col-75 pull-right">
                    <router-link to="/agents">Agents</router-link>
                    <router-link to="/help">Help</router-link>
                    <router-link to="/contact">Contact</router-link>
                    <router-link to="/pricing">Pricing</router-link>
                    <router-link to="/create-account" v-if="!account"
                        >Sign Up</router-link
                    >
                    <router-link to="/login" class="sign-in" v-if="!account">
                        <span>Sign In</span>
                        <i class="fa fa-arrow-right"></i>
                    </router-link>
                    <router-link to="/app" class="sign-in" v-if="account">
                        <span>Database</span>
                        <i class="fa fa-arrow-right"></i>
                    </router-link>
                </div>
            </div>
        </div>
        <div class="changelog-body">
            <h1>Changelog</h1>
            <p class="changelog-intro">
                What's new in InvokeDB, newest first. Each change links to its
                pull request. See the <router-link to="/help">help</router-link>
                for how to use it.
            </p>
            <div class="changelog-day" v-for="day in days" :key="day.date">
                <h2>
                    <time :datetime="day.date">{{ day.label }}</time>
                </h2>
                <ul>
                    <li v-for="c in day.changes" :key="c.number">
                        <span>{{ c.title }}</span>
                        <a
                            class="changelog-pr"
                            :href="c.url"
                            target="_blank"
                            rel="noopener"
                            >#{{ c.number }}</a
                        >
                    </li>
                </ul>
            </div>
            <p v-if="days.length === 0">No changes yet.</p>
        </div>
        <div class="footer">
            <div class="flex-row">
                <div class="col">© InvokeDB, LLC</div>
            </div>
        </div>
    </div>
</div>
